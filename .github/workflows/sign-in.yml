```yaml
name: Skland Auto Sign In

on:
  workflow_dispatch:

  schedule:
    # 北京时间每天 05:17（UTC 21:17）
    - cron: "17 21 * * *"

    # 北京时间每天 13:17（UTC 05:17）
    - cron: "17 5 * * *"

# 允许 GitHub Actions 使用 GITHUB_TOKEN 推送 .last-run
permissions:
  contents: write

jobs:
  sign-in:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SKLAND_TOKEN: ${{ secrets.SKLAND_TOKEN }}
      SKLAND_TOKENS: ${{ secrets.SKLAND_TOKENS }}
      SKLAND_USERS_JSON: ${{ secrets.SKLAND_USERS_JSON }}

      WEBHOOK_URL: "https://webhook.gsd2qa.workers.dev/"

    steps:
      # =========================
      # 1. 检出代码
      # =========================
      - name: 检出代码
        uses: actions/checkout@v5

      # =========================
      # 2. 设置 Python 环境
      # =========================
      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # =========================
      # 3. 安装依赖
      # =========================
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =========================
      # 4. 运行签到
      # =========================
      - name: 运行签到脚本
        id: sign_in
        continue-on-error: true
        run: python main.py

      # =========================
      # 5. 保持仓库活跃
      # 只有签到脚本成功时才执行
      # =========================
      - name: Keep repo active
        if: steps.sign_in.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          date -u +"%Y-%m-%d %H:%M:%S UTC" > .last-run

          git add .last-run

          if ! git diff --cached --quiet; then
            git commit -m "chore: keep repo active [skip ci]"
            git push
          else
            echo "没有需要提交的变更"
          fi

      # =========================
      # 6. Webhook 通知
      # 无论签到成功还是失败都会执行
      # =========================
      - name: Webhook 通知
        if: always()
        env:
          SIGN_IN_STATUS: ${{ steps.sign_in.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$SIGN_IN_STATUS" = "success" ]; then
            TITLE="森空岛签到成功"
            MESSAGE="本次森空岛签到脚本执行成功。"
            STATUS="success"
          else
            TITLE="森空岛签到失败"
            MESSAGE="本次森空岛签到脚本执行失败，请检查 GitHub Actions 日志。"
            STATUS="failure"
          fi

          jq -n \
            --arg title "$TITLE" \
            --arg message "$MESSAGE" \
            --arg status "$STATUS" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_url "$RUN_URL" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg time "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            '{
              title: $title,
              message: $message,
              status: $status,
              repository: $repository,
              workflow: $workflow,
              run_id: $run_id,
              run_url: $run_url,
              event: $event,
              time: $time
            }' > /tmp/webhook.json

          echo "Webhook 请求内容："
          cat /tmp/webhook.json

          if curl \
            --request POST \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/webhook.json \
            --fail-with-body \
            --silent \
            --show-error \
            "$WEBHOOK_URL"; then

            echo
            echo "Webhook 发送成功"
          else
            echo
            echo "Webhook 发送失败，但不影响签到结果"
          fi

      # =========================
      # 7. 如果签到失败，让 Job 最终显示失败
      # =========================
      - name: 检查签到结果
        if: steps.sign_in.outcome != 'success'
        run: |
          echo "森空岛签到失败"
          exit 1
```
